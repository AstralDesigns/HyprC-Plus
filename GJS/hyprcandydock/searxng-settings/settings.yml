# SearXNG settings for HyprCandy local search instance
# Generated by HyprCandy — persistent local config
use_default_settings: true

search:
  # Enable both HTML (for browser fallback) and JSON (for native GJS results)
  formats:
    - html
    - json
  # Safe search off by default
  safe_search: 0
  autocomplete: ""

server:
  bind_address: "0.0.0.0"
  port: 8080
  # Permanent local secret key
  secret_key: "hyprcandy-permanent-local-secret-key-3f98a21b44c8"
  # Disable rate limiter for local single-user use
  limiter: false
  image_proxy: false

outgoing:
  request_timeout: 4.0
  max_request_timeout: 6.0

ui:
  default_theme: simple
  infinite_scroll: false

enabled_plugins:
  - Basic Calculator
  - Hash plugin
  - Self Information
  - Tracker URL remover

engines:
  - name: bing
    engine: bing
    shortcut: bi
    disabled: false
  - name: qwant
    engine: qwant
    shortcut: qw
    disabled: false
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
  - name: github
    engine: github
    shortcut: gh
    disabled: false
  - name: brave
    engine: brave
    shortcut: br
    disabled: false
  - name: google
    engine: google
    disabled: true
  - name: google cse
    engine: google_cse
    disabled: true
  - name: startpage
    engine: startpage
    disabled: true
